name: Собрать APK

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Папка приложения внутри apps/ — например 01-arina"
        required: true
      appname:
        description: "Название под иконкой на телефоне"
        required: true
        default: "Моё приложение"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Подготовить проект
        env:
          FOLDER: ${{ inputs.folder }}
          APPNAME: ${{ inputs.appname }}
        run: |
          set -e
          if [ ! -f "apps/$FOLDER/index.html" ]; then
            echo "Не нашёл apps/$FOLDER/index.html — проверьте имя папки"; exit 1
          fi
          mkdir -p build/www
          cp -r "apps/$FOLDER/." build/www/
          ID=$(printf '%s' "$FOLDER" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')
          if [ ${#ID} -lt 3 ]; then
            ID="$ID$(printf '%s' "$FOLDER" | md5sum | cut -c1-6)"
          fi
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          npx cap init "$APPNAME" "ru.mkai.a$ID" --web-dir www
          npx cap add android

      - name: Собрать APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        env:
          FOLDER: ${{ inputs.folder }}
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk "$FOLDER.apk"

      - name: Положить в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOLDER: ${{ inputs.folder }}
        run: |
          TAG="apk-$FOLDER-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "$FOLDER.apk" \
            --title "APK: $FOLDER" \
            --notes "Отладочная сборка. Android попросит разрешить установку из неизвестных источников."

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.folder }}
          path: ${{ inputs.folder }}.apk
